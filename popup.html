<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fabric Guided Learning</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    h3 {
      margin: 0 0 6px 0;
      font-size: 14px;
      color: #0f6cbd;
    }
    p {
      margin: 0 0 10px 0;
      font-size: 12px;
      color: #475569;
      line-height: 1.45;
    }
    .badge {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 99px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="badge">● PoC Extension Active</div>
  <h3>Microsoft Fabric Guided Learning</h3>
  <p>Control the guided learning overlay on <strong>app.fabric.microsoft.com</strong>:</p>
  <div style="display:flex; gap:8px; margin-top:10px;">
    <button id="btn-show" style="flex:1; padding:7px 10px; background:#0f6cbd; color:#fff; border:none; border-radius:6px; font-weight:600; cursor:pointer; font-size:12px;">
      ▶ Show Guide
    </button>
    <button id="btn-hide" style="flex:1; padding:7px 10px; background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; border-radius:6px; font-weight:600; cursor:pointer; font-size:12px;">
      ✕ Clean Up
    </button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
